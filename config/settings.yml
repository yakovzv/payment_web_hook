dynaconf_merge: true
default:
  NAME: python
  HOST: 0.0.0.0
  PORT: 8001
  EXT_PORT: 5005
  ENDPOINT: api
  WORKERS: 1
  FAST_API_PATH: app:application
  RELOADED: False
  CORS:
    allow_origins: ['*']
    allow_methods: '*'
    allow_headers: '*'
    allow_credentials: True
    expose_headers: '*'
    max_age: 3600
  POSTGRES:
    host: 10.10.33.3
    port: 5432
    login: suser
    password: QiAk182Az2JtxmZ00uFy
    database: carver
    pool_min_size: 10
    pool_max_size: 20
    pool_timeout: 90
  LOGGING:
    version: 1
    disable_existing_loggers: false
    file_path: logs
    formatters:
      default:
        format: "%(levelname)-8s# %(filename)s[LINE:%(lineno)d] [%(asctime)s.%(msecs)d]:  %(message)s"
      access:
        format: "%(levelname)-8s# [%(asctime)s.%(msecs)d] %(client_addr)s - '%(request_line)s' %(status_code)s"
    handlers:
      console:
        level: DEBUG
        class: logging.StreamHandler
        formatter: default
        stream: ext://sys.stdout
      error:
        level: ERROR
        class: logging.StreamHandler
        formatter: default
        stream: ext://sys.stderr
    loggers:
      root:
        level: INFO
        handlers: [ console, error ]
