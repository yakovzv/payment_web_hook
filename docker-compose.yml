services:
  postgres:
    container_name: shop_postgres
    image: postgres:17.4
    restart: unless-stopped
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    container_name: shop_migrate
    build:
      context: .
      dockerfile: ./docker/api/Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["uv", "run", "yoyo", "apply", "-b", "--database", "${DATABASE_URL}", "./migrations"]
    restart: "no"

  app:
    container_name: shop_app
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./docker/api/Dockerfile
    env_file:
      - .env
    volumes:
      - ./logs:/logs
    command: ["uv", "run", "main.py"]
    ports:
      - "${EXT_PORT}:${PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  suppliers:
    container_name: shop_suppliers
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./docker/api/Dockerfile
    env_file:
      - .env
    command: ["uv", "run", "main_supplier.py"]
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully